<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CosmoVision — Explore the Universe. Discover the Unknown.</title>
    <meta
      name="description"
      content="CosmoVision is an interactive 3D space exploration platform: navigate a procedural galaxy, visit the Sun and its planets, inspect moons and asteroid belts, run a time simulation and read source-backed astronomy data."
    />
    <meta name="theme-color" content="#05070f" />
    <meta name="author" content="Deepesh Chaurasia" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="CosmoVision — Explore the Universe. Discover the Unknown." />
    <meta
      property="og:description"
      content="Interactive 3D space exploration and universe simulation platform built with React, TypeScript and Three.js."
    />
    <meta property="og:site_name" content="CosmoVision" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CosmoVision — Explore the Universe. Discover the Unknown." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CosmoVision",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any modern browser with WebGL2",
        "offers": { "@type": "Offer", "price": "0" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <noscript>
      <main class="noscript-fallback">
        <h1>CosmoVision — Explore the Universe. Discover the Unknown.</h1>
        <p>
          The interactive 3D universe requires JavaScript and WebGL2. The essential object data is listed below so the
          information stays readable without them. Distances are mean heliocentric distances; diameters are mean
          geometric diameters. Source: NASA planetary fact sheets.
        </p>
        <table>
          <caption>Solar System objects</caption>
          <thead>
            <tr>
              <th scope="col">Object</th>
              <th scope="col">Type</th>
              <th scope="col">Mean diameter</th>
              <th scope="col">Distance from Sun</th>
              <th scope="col">Orbital period</th>
            </tr>
          </thead>
          <tbody>
            <tr><th scope="row">Sol</th><td>G-type star</td><td>1,392,700 km</td><td>—</td><td>—</td></tr>
            <tr><th scope="row">Mercury</th><td>Terrestrial planet</td><td>4,879 km</td><td>0.39 AU</td><td>88 days</td></tr>
            <tr><th scope="row">Venus</th><td>Terrestrial planet</td><td>12,104 km</td><td>0.72 AU</td><td>224.7 days</td></tr>
            <tr><th scope="row">Earth</th><td>Terrestrial planet</td><td>12,756 km</td><td>1.00 AU</td><td>365.25 days</td></tr>
            <tr><th scope="row">Mars</th><td>Terrestrial planet</td><td>6,792 km</td><td>1.52 AU</td><td>687 days</td></tr>
            <tr><th scope="row">Jupiter</th><td>Gas giant</td><td>142,984 km</td><td>5.20 AU</td><td>11.9 years</td></tr>
            <tr><th scope="row">Saturn</th><td>Gas giant</td><td>120,536 km</td><td>9.58 AU</td><td>29.5 years</td></tr>
            <tr><th scope="row">Uranus</th><td>Ice giant</td><td>51,118 km</td><td>19.2 AU</td><td>84 years</td></tr>
            <tr><th scope="row">Neptune</th><td>Ice giant</td><td>49,528 km</td><td>30.1 AU</td><td>165 years</td></tr>
            <tr><th scope="row">Luna</th><td>Moon of Earth</td><td>3,475 km</td><td>0.00257 AU from Earth</td><td>27.3 days</td></tr>
          </tbody>
        </table>
        <p>Documentation: README.md, docs/SCIENCE.md and docs/CONTROLS.md in the project repository.</p>
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
